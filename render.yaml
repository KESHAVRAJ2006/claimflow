# Render Blueprint for ClaimFlow on Render's FREE plan: the API and the reviewer console, 512 MB each.
# Deploy: Render dashboard -> New -> Blueprint -> this repository. Full walkthrough: docs/DEPLOYMENT.md.
#
# Not created here:
#   - Postgres: a Neon free project (DATABASE_URL below). Render's free Postgres is deleted after 30 days.
#   - Qdrant:   a Qdrant Cloud free cluster (QDRANT_URL / QDRANT_API_KEY below).
#   - n8n:      n8n Cloud or any n8n you run; import n8n/claimflow-notifications.json (N8N_WEBHOOK_URL below).
# Values marked `sync: false` are asked for once, when the Blueprint is first applied.
#
# Free instances sleep after 15 minutes without traffic; the first request after that waits for them to start.
# For always-on hosting, change both `plan: free` to `starter` or larger.

services:
  - type: web
    name: claimflow-api
    runtime: docker
    # Builds the Dockerfile's last stage (runtime): no dev tools, no tests, non-root, model baked in.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Measured under a 512 MB limit: ~345 MB after startup, ~375 MB at most (two triage runs at once, a 10 MB
    # upload). It fits because production runs the embedding model as ONNX, without torch.
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # The Neon connection string, pasted as it is (connection pooling off; see docs/DEPLOYMENT.md).
      - key: DATABASE_URL
        sync: false
      # The agents' SELECT-only login. render.yaml cannot build a URL from parts, so Settings derives
      # TOOLS_DATABASE_URL from DATABASE_URL and these two; scripts/serve.py creates the login on every start.
      - key: AGENT_DB_USER
        value: claimflow_agent
      - key: AGENT_DB_PASSWORD
        generateValue: true
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # At least one LLM key; both gives the Groq -> Gemini fallback.
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      # Shared with the console (below), which adds it server-side. 256 random bits; production requires 32+ chars.
      - key: API_KEY
        generateValue: true
      # Only the console calls the API, server to server; no browser origin needs CORS.
      - key: CORS_ORIGINS
        value: "[]"
      - key: N8N_WEBHOOK_URL
        sync: false
      # Copy this value into n8n as CLAIMFLOW_WEBHOOK_SECRET, so n8n can verify each event's signature.
      - key: WEBHOOK_SECRET
        generateValue: true
      # A demo deployment starts with the synthetic data set (never wipes data the app has written).
      - key: SEED_DEMO_DATA
        value: "true"
      - key: MAX_CONCURRENT_RUNS
        value: "2"
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: claimflow-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: singapore
    # Exempt from the Basic auth; answers without calling the API.
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # The API's public URL, shown at the top of claimflow-api's page once it exists. Enter http://localhost:8000
      # here, then set the real URL after the first deploy. Never guess https://claimflow-api.onrender.com: that
      # name belongs to another service, and the console sends API_KEY with every request to this URL.
      # Free services cannot receive private network traffic, so the console calls the API over HTTPS.
      - key: BACKEND_URL
        sync: false
      - key: API_KEY
        fromService:
          type: web
          name: claimflow-api
          envVarKey: API_KEY
      # HTTP Basic auth for the whole console (middleware.ts). Read the generated password in the dashboard.
      - key: CONSOLE_USER
        value: reviewer
      - key: CONSOLE_PASSWORD
        generateValue: true
