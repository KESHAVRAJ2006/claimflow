# Alembic configuration. Run commands from the backend/ directory (the container's /app).
[alembic]
script_location = %(here)s/migrations
# Makes `import app` work inside env.py.
prepend_sys_path = .
# Split path lists with the OS separator (Alembic's future default; silences its deprecation warning).
path_separator = os
# Date-prefixed filenames so migrations list in the order they were written.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# sqlalchemy.url is deliberately absent: env.py reads DATABASE_URL through app settings,
# so credentials are configured in exactly one place.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
